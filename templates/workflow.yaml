version: 1
project: my-project
main_branch: main
commands:                       # 合并验证与闸门只能引用这里定义的命令名；由 architect 在规划阶段按项目的技术栈改写（docs/rules-draft/commands.yaml）
  install:   "pnpm install"
  typecheck: "pnpm typecheck"
  lint:      "pnpm lint"
  test:      "pnpm test"
  # merge_check: "uv run alembic heads | test $(wc -l) -eq 1"   # 可选：合并时和全量测试一起跑的额外检查，例如迁移只能有一个 head
limits:
  max_parallel: 3               # 同时进行的模块数；本地模型服务要能承受这么多并发
  max_attempts: 3
  lease_minutes: 45
  max_violations_per_run: 5     # 每次运行被拦下的操作达到此数即终止
  max_task_files: 40
  fix_max_files: 5              # 修 bug 改动超过这么多文件时建议改用 --feature
  session_retention_days: 14    # 子进程会话留档保留天数，/flow doctor --fix 清理
  bash_timeout_s: 300           # 子进程每条 bash 命令最多运行的秒数（挂起的测试会被结束，模型能看到超时）
  auto_dispatch: true           # ready 任务由程序自动派发，主 agent 只负责沟通
  continue_session: true        # 返工、验收修复、恢复时接着原来的会话继续
  merge_batch: 3                # 合并队列里最多 3 个模块一起 rebase、只跑一次全量测试，失败再逐个合并；1 关闭
review:
  final: false                  # 最终代码审查：所有模块验收通过后，一个审查者对照项目规范审查整个流程的改动；必须改的自动修，建议由你挑选
context:
  compact_at: 0.7               # 上下文占用到 70% 时压缩；压缩后靠 notes（结构化笔记）与 history（历史检索）延续
models:                         # 档位到具体模型的映射；也可以用 /flow-config 按角色设置
  strong: "<provider/model>"
  medium: "<provider/model>"
  cheap:  "<provider/model>"
escalation:                     # 同一任务失败 after_failures 次后，下一次实施换成升级模型（/flow-config escalate 设置）
  after_failures: 2
  critical_fanout: 0
# budget:                       # 每个流程的预算（可选；也可以用 /flow budget 为单个流程设置）
#   tokens: 5000000             # 输入 + 输出，不含缓存
#   cost: 20                    # 金额（Pi 报告的 cost）
#   warn_ratio: 0.8             # 用到这个比例时提醒；超出后暂停派发新任务
modes:
  build:
    stages:
      - { id: D0, name: requirements, phase: requirements, gate: { human: true } }
      - { id: D1, name: prototype,    phase: prototype,    gate: { human: true } }
      - { id: D2, name: planning,     phase: planning,     gate: { human: true } }
      - { id: E,  name: modules,      phase: execution,    gate: { all_tasks_done: true, auto: [test], human: true } }
  feature:
    stages:
      - { id: D0, name: requirements, phase: requirements, gate: { human: true } }
      - { id: D1, name: prototype,    phase: prototype,    gate: { human: true } }
      - { id: D2, name: planning,     phase: planning,     gate: { human: true } }
      - { id: E,  name: modules,      phase: execution,    gate: { all_tasks_done: true, auto: [test], human: true } }
scopes:
  prototype:    { writes: ["prototype/**", "DESIGN.md", "docs/design/**"] }
  planning:     { writes: ["docs/modules.md", "docs/glossary.md", "docs/interfaces/**", "docs/adr/**", "docs/rules-draft/**", "AGENTS.md"] }
  code:         { rules: [rules/global.md, rules/project.md], writes: ["**"] }   # 模块的实际可写范围由规划阶段为每个模块指定；受保护路径（.flow、.git、workflow.yaml、rules、.pi）一律不可写
  research:     { writes: ["docs/research/**"] }
  acceptance:   { rules: [rules/global.md, rules/project.md], writes: [] }
  review:       { rules: [rules/global.md, rules/project.md], writes: [] }
tool_groups:                    # 已核实：pi-serena 0.9.20、pi-codegraph 0.1.10、pi-web-access 0.35.0、pi-ask-user 0.2.1
  serena_read: [serena_get_symbols_overview, serena_find_symbol, serena_find_referencing_symbols, serena_search_for_pattern,
                serena_find_declaration, serena_find_implementations, serena_get_diagnostics_for_file]
  # 一律按写操作对待。serena_rename_symbol 会改动所有引用处的文件，guard 无法限定范围，故不纳入
  serena_edit: [serena_replace_symbol_body, serena_insert_before_symbol, serena_insert_after_symbol,
                serena_safe_delete_symbol, serena_replace_content]
  codegraph:   [codegraph_search, codegraph_callers, codegraph_callees, codegraph_impact, codegraph_explore,
                codegraph_node, codegraph_status, codegraph_files]
  web:         [web_search, fetch_content, get_search_content, source_check]
  ask:         [ask_user]       # 主 agent 讨论需求时向你提选择题（@tian.zuo/pi-ask-user，装在主会话的 pi 里）
roles:                          # notes、history、flow_block、flow_learn 所有角色隐式拥有
  orchestrator:  { model: strong, tools: [read, grep, find, ls, "@ask", flow_status, flow_dispatch, flow_wait, flow_requirements], read_paths: ["**"], writes: [] }   # 需求讨论时要查现有代码；不能写
  designer:      { model: strong, scopes: [prototype], tools: [read, write, edit, flow_note, flow_submit] }
  architect:     { model: strong, scopes: [planning], tools: [codemode, read, write, edit, bash_readonly, "@serena_read", "@codegraph", flow_propose_modules, flow_note, flow_submit] }
  implementer:   { model: strong, scopes: [code], tools: [read, write, edit, bash, "@serena_read", "@serena_edit", "@codegraph", flow_sync, flow_note, flow_submit] }
  acceptor:      { model: strong, scopes: [acceptance], tools: [read, bash, "@serena_read", "@codegraph", flow_accept, flow_accept_confirm] }
  reviewer:      { model: strong, scopes: [review], tools: [read, bash_readonly, "@serena_read", "@codegraph", flow_review_report] }   # 只在 review.final 开启时使用
  researcher:    { model: medium, scopes: [research], tools: [read, write, "@web", flow_note, flow_submit] }
